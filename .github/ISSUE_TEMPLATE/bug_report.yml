name: Bug report
description: Report a reproducible defect in EarthSynoptic.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects in EarthSynoptic.
        Do not report security vulnerabilities here. Follow the instructions in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect clearly and concisely.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the defect.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happened, including any relevant error messages.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and version context
      description: Provide relevant operating system, browser, device, build, commit, or runtime details.
      placeholder: Include only information relevant to reproducing the defect.
    validations:
      required: true

  - type: dropdown
    id: scientific-impact
    attributes:
      label: Scientific or data impact
      description: Could this defect affect scientific interpretation, data integrity, provenance, uncertainty, licensing, or attribution?
      options:
        - No known impact
        - Possible impact
        - Confirmed impact
        - Unsure
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and provenance context
      description: Provide relevant source identifiers, timestamps, data revisions, screenshots, logs, or provenance details when applicable.
      placeholder: Do not include secrets, credentials, tokens, private keys, or sensitive personal data.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context that may help reproduce or assess the defect.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Contributor acknowledgements
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I have not included secrets, credentials, private keys, tokens, or sensitive local configuration.
          required: true
        - label: I have reviewed CONTRIBUTING.md and understand that security vulnerabilities must follow SECURITY.md reporting instructions.
          required: true
